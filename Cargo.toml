[package]
name = "droidlens"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Single-class Android decompiler for AI agents: rust_ASC extraction plus a warm JADX JVM"
publish = false

[dependencies]
rust_ASC = { path = "third_party/rust_ASC", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
ureq = "3"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "time"] }

[dev-dependencies]
tree-sitter = "0.25"
tree-sitter-java = "0.23"

# Tests drive the debug binary; the extraction code must not run unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
